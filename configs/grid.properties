# ============================================================================
#  Main grid (the run reported in report/REPORT.md: results/grid-20261109-095145).
#  Warm-up / measurements / forks were chosen from results/pilot-20261109-093257.
#
#  ./scripts/run.ps1 configs/grid.properties -DryRun     (counts + time estimate)
#  ./scripts/run.ps1 configs/grid.properties
# ============================================================================
mode=grid
# auto = JMH when built with Maven, otherwise the pure-JDK fork backend
backend=auto
data=data
results=results

# ---- datasets (group "sweep" = 51 datasets) -------------------------------
group=sweep
dists=random,nearly_sorted,duplicates,sorted,reversed
seeds=0-4
# sizes: all sizes of the group (10000, 100000, 1000000)

# ---- cutoffs ---------------------------------------------------------------
cutoffs=0-64
# Measure one cutoff per equivalence class (identical recursion tree => identical work);
# the classes are verified on the implementation (see equivalence.csv of the run).
dedupe=true
# Always measured separately: cutoff 1 does the same work as 0 -> measurement-noise check.
controls=0,1
countCompares=true

# ---- measurement (from the pilot) ------------------------------------------
warmup=20
measurements=10
forks=3
# N = 10^4: one sort takes ~1 ms, the JIT needs many more iterations and single shots are noisier
warmup.10000=100
measurements.10000=30
forks.10000=5

orderSeed=20261103
jvmArgs=-Xms2g -Xmx2g -XX:+UseParallelGC
