# ============================================================================
#  Doubling test (topic 1.3): random input, N = 2^12 .. 2^20, CUTOFF in {0, 7, 10, best}.
#  "best" is replaced by results/best_cutoff.txt (written by scripts/analyze.py on the grid run).
#  Settings below are those of the reported run (results/doubling-20261109-112935).
#  Small N need far more warm-up: one sort of 4096 keys takes ~0.5 ms.
#
#  ./scripts/run.ps1 configs/doubling.properties
# ============================================================================
mode=doubling
backend=auto
data=data
results=results

group=doubling
dists=random
seeds=0
cutoffs=0,7,10,best
bestFile=results/best_cutoff.txt
dedupe=true
controls=0,7,10
countCompares=true

warmup=20
measurements=10
forks=3
warmup.4096=300
warmup.8192=200
warmup.16384=100
warmup.32768=50
measurements.4096=30
measurements.8192=30
measurements.16384=30
forks.4096=5
forks.8192=5

orderSeed=20261104
jvmArgs=-Xms2g -Xmx2g -XX:+UseParallelGC
