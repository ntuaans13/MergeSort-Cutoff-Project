# ============================================================================
#  Pilot: 4 datasets x 5 cutoffs, every iteration (warm-up included) is recorded so the
#  warm-up curve can be inspected. Settings below are those of the reported pilot
#  (results/pilot-20261109-093257).
#
#  ./scripts/pilot.ps1 -Warmup 20 -Measurements 10 -Forks 3
#  (the script overrides warmup/measurements/forks; the per-size lines below still apply)
# ============================================================================
mode=pilot
backend=auto
data=data
results=results

datasets=random_n10000_s0,random_n100000_s0,random_n1000000_s0,duplicates_n1000000_s0
cutoffs=0,4,8,16,32
dedupe=false
countCompares=false

warmup=20
measurements=10
forks=3
warmup.10000=100
measurements.10000=30
forks.10000=5

orderSeed=20261103
jvmArgs=-Xms2g -Xmx2g -XX:+UseParallelGC
